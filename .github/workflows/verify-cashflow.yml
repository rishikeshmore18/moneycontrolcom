name: Verify cashflow changes

on:
  pull_request:
    paths:
      - "src/lib/cashflow/**"
      - "src/components/cashflow/**"
      - ".github/workflows/verify-cashflow.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The existing lockfile omits an npm transitive dependency.
      # Install without rewriting it here; lockfile repair is separate.
      - run: npm install --no-save --package-lock=false
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
