name: Cashflow changed-file checks

on:
  pull_request:
    paths:
      - "src/lib/cashflow/**"
      - "src/lib/plaid/**"
      - "src/routes/api/public/plaid/**"
      - "supabase/migrations/**"
      - "src/components/cashflow/**"
      - ".github/workflows/verify-cashflow.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The existing lockfile omits an npm transitive dependency.
      # Install without rewriting it here; lockfile repair is separate.
      - run: npm install --no-save --package-lock=false --legacy-peer-deps
      - name: TypeScript (allow only known pre-existing errors)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          result=$?
          set -e
          cat /tmp/tsc.log
          if [ "$result" -ne 0 ]; then
            unexpected=$(grep "error TS" /tmp/tsc.log | grep -Ev 'src/lib/api/example.functions.ts|src/lib/plaid/plaid.functions.ts|src/routes/__root.tsx' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::New TypeScript errors in files outside the baseline exceptions"
              exit 1
            fi
            echo "::warning::Existing TanStack API typing errors remain outside this PR"
          fi
      - name: Cashflow reconciliation and account balance regression tests
        run: npx vitest run --config vitest.config.ts src/lib/cashflow/incomeActivityCalendar.test.ts src/lib/cashflow/sharedAssignment.test.ts src/lib/cashflow/accountBalanceAuthority.test.ts src/lib/cashflow/profileCashDisplay.test.ts src/lib/cashflow/cardPaymentLedger.test.ts src/lib/cashflow/cardPaymentTiming.test.ts src/lib/cashflow/recentlyClosedStatement.test.ts src/lib/cashflow/outstandingCardBalances.test.ts src/lib/cashflow/estimatedCardPayments.test.ts src/lib/cashflow/cardLiability.test.ts src/lib/plaid/liabilities.test.ts
      - name: Compile changed UI modules
        run: npx esbuild src/components/cashflow/IncomeTimesheet.tsx src/components/cashflow/Dashboard.tsx src/components/cashflow/CardsScreen.tsx src/components/cashflow/PlaidConnections.tsx src/components/cashflow/PlaidLinkButton.tsx --bundle --platform=browser --format=esm --outdir=/tmp/cashflow-ui-check --external:*
      - name: Full Vitest suite
        id: full
        continue-on-error: true
        run: npm test
      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: ESLint audit
        id: lint
        if: always()
        continue-on-error: true
        run: npm run lint
      - name: Final required check gate
        if: always()
        env:
          FULL_RESULT: ${{ steps.full.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          echo "Full tests: $FULL_RESULT; build: $BUILD_RESULT; lint: $LINT_RESULT"
          test "$FULL_RESULT" = success && test "$BUILD_RESULT" = success && test "$LINT_RESULT" = success
  baseline-full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-save --package-lock=false --legacy-peer-deps
      - name: Full test suite on unchanged main (baseline diagnostic)
        run: npm test


