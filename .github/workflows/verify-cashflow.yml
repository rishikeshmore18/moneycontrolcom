name: Verify cashflow changes

on:
  pull_request:
    paths:
      - "src/lib/cashflow/**"
      - "src/components/cashflow/**"
      - ".github/workflows/verify-cashflow.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
